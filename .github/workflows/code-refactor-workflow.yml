name: Code Refactor Workflow

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      refactor_type:
        description: 'Type of refactoring to perform'
        required: true
        type: choice
        options:
          - modernize
          - simplify
          - optimize
          - cleanup

# Prevent duplicate refactor runs
concurrency:
  group: code-refactor-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@copilot refactor')
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Checkout the PR branch when triggered by PR events
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Determine refactor type
        id: refactor-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REFACTOR_TYPE="${{ inputs.refactor_type }}"
          else
            COMMENT="${{ github.event.comment.body }}"
            
            # Parse refactor type from comment
            if echo "$COMMENT" | grep -qi "modernize"; then
              REFACTOR_TYPE="modernize"
            elif echo "$COMMENT" | grep -qi "simplify"; then
              REFACTOR_TYPE="simplify"
            elif echo "$COMMENT" | grep -qi "optimize"; then
              REFACTOR_TYPE="optimize"
            elif echo "$COMMENT" | grep -qi "cleanup"; then
              REFACTOR_TYPE="cleanup"
            else
              REFACTOR_TYPE="general"
            fi
          fi
          
          echo "refactor_type=$REFACTOR_TYPE" >> $GITHUB_OUTPUT
      
      - name: Run refactoring analysis
        run: |
          REFACTOR_TYPE="${{ steps.refactor-type.outputs.refactor_type }}"
          echo "Analyzing code for $REFACTOR_TYPE refactoring..."
          
          # Placeholder for actual refactoring logic
          case "$REFACTOR_TYPE" in
            modernize)
              echo "Analyzing for code modernization opportunities..."
              ;;
            simplify)
              echo "Identifying complex code that can be simplified..."
              ;;
            optimize)
              echo "Finding performance optimization opportunities..."
              ;;
            cleanup)
              echo "Detecting code cleanup opportunities..."
              ;;
            *)
              echo "General refactoring analysis..."
              ;;
          esac
      
      - name: Apply automated refactoring
        run: |
          echo "Applying safe automated refactoring..."
          
          # Run linting with auto-fix
          npm run lint:fix || true
          
          # Run prettier
          npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,css,scss,md}" || true
      
      - name: Commit refactored code
        id: commit
        run: |
          # Check if this is a fork PR
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "" ] && \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "⚠️ Cannot push to fork PR. Skipping auto-commit."
            echo "Please run refactoring locally and push the changes."
            echo "changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            REFACTOR_TYPE="${{ steps.refactor-type.outputs.refactor_type }}"
            git commit -m "refactor: automated $REFACTOR_TYPE refactoring

This commit was generated by the code refactor workflow.
            "
            git push
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Report refactoring results
        if: github.event_name == 'issue_comment' && steps.commit.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const refactorType = '${{ steps.refactor-type.outputs.refactor_type }}';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `✅ Code refactoring completed: **${refactorType}**\n\nChanges have been committed and pushed.`
            });

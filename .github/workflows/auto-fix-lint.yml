name: Auto Fix Lint

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Prevent multiple runs for same PR to save minutes
concurrency:
  group: auto-fix-lint-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-fix:
    if: |
      github.event_name == 'pull_request' || 
      contains(github.event.comment.body, '@copilot fix lint')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run lint fix
        run: npm run lint:fix || true
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-fix lint issues"
          git push

name: AetherCanvas Gradle Cache

on:
  push:
    branches:
      - ci/aethercanvas-android-toolchain-20260901
    paths:
      - .github/workflows/aethercanvas-gradle-cache.yml

permissions:
  contents: read

jobs:
  package-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GRADLE_USER_HOME: ${{ runner.temp }}/aethercanvas-gradle-home
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install exact Android SDK components
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            'platforms;android-36' \
            'build-tools;36.1.0' \
            'platform-tools'

      - name: Download and verify Gradle 8.13
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/gradle-8.13-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  '"$RUNNER_TEMP/gradle-8.13-bin.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"

      - name: Create source-free dependency harness
        shell: bash
        run: |
          set -Eeuo pipefail
          HARNESS="$RUNNER_TEMP/aethercanvas-dependency-harness"
          mkdir -p "$HARNESS/app/src/main"
          cat > "$HARNESS/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AetherCanvasDependencyHarness"
          include(":app")
          EOF
          cat > "$HARNESS/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("com.android.library") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.2.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.21" apply false
              id("org.jetbrains.kotlin.plugin.serialization") version "2.2.21" apply false
              id("com.google.devtools.ksp") version "2.3.11" apply false
          }
          EOF
          cat > "$HARNESS/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.nonFinalResIds=true
          kotlin.code.style=official
          EOF
          cat > "$HARNESS/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("org.jetbrains.kotlin.plugin.serialization")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "app.aethercanvas.dependencyharness"
              compileSdk = 36
              buildToolsVersion = "36.1.0"
              defaultConfig {
                  applicationId = "app.aethercanvas.dependencyharness"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.11.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.3")
              implementation("androidx.navigation:navigation-compose:2.9.3")
              implementation("androidx.room:room-runtime:2.8.4")
              implementation("androidx.room:room-ktx:2.8.4")
              ksp("androidx.room:room-compiler:2.8.4")
              implementation("androidx.datastore:datastore-preferences:1.2.0")
              implementation("androidx.work:work-runtime-ktx:2.11.2")
              implementation("androidx.security:security-crypto:1.1.0")
              implementation("androidx.exifinterface:exifinterface:1.4.1")
              implementation(platform("androidx.compose:compose-bom:2025.08.01"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.ui:ui-tooling")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("io.coil-kt.coil3:coil-compose:3.4.0")
              implementation("io.coil-kt.coil3:coil-network-okhttp:3.4.0")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
              androidTestImplementation("androidx.test.ext:junit-ktx:1.3.0")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
              androidTestImplementation(platform("androidx.compose:compose-bom:2025.08.01"))
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
          }
          EOF
          cat > "$HARNESS/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme" />
          </manifest>
          EOF
          mkdir -p "$HARNESS/app/src/main/res/values"
          cat > "$HARNESS/app/src/main/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF

      - name: Resolve and exercise every pinned variant
        shell: bash
        run: |
          set -Eeuo pipefail
          HARNESS="$RUNNER_TEMP/aethercanvas-dependency-harness"
          GRADLE="$RUNNER_TEMP/gradle-8.13/bin/gradle"
          cd "$HARNESS"
          "$GRADLE" --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleAndroidTest \
            :app:lintDebug \
            :app:assembleRelease

      - name: Package portable module cache
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$GRADLE_USER_HOME/caches/modules-2"
          mkdir -p cache-payload/caches
          cp -a "$GRADLE_USER_HOME/caches/modules-2" cache-payload/caches/
          find cache-payload -type f -print0 | sort -z | xargs -0 sha256sum > cache-payload/SHA256SUMS.txt
          {
            echo 'AetherCanvas pinned Gradle dependency cache'
            echo 'Gradle: 8.13'
            echo 'Android Gradle Plugin: 8.13.2'
            echo 'Kotlin: 2.2.21'
            echo 'KSP: 2.3.11'
            echo 'Compose BOM: 2025.08.01'
            echo
            du -sh cache-payload/caches/modules-2
          } > cache-payload/CACHE_MANIFEST.txt
          tar --zstd -cf aethercanvas-gradle-cache.tar.zst -C cache-payload .
          sha256sum aethercanvas-gradle-cache.tar.zst > aethercanvas-gradle-cache.tar.zst.sha256
          ls -lh aethercanvas-gradle-cache.tar.zst

      - name: Upload dependency cache
        uses: actions/upload-artifact@v4
        with:
          name: aethercanvas-gradle-cache
          path: |
            aethercanvas-gradle-cache.tar.zst
            aethercanvas-gradle-cache.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
